name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Lint is intentionally not gated yet: 3 pre-existing
      # react-hooks/static-components errors need clearing first (see #127 card).
      - name: Tests
        run: npm run test
      - name: Build
        run: npm run build
